[project]
name = "yahoo-fantasy-cloud-mcp"
version = "0.1.0"
description = "Serverless FastMCP Yahoo Fantasy Server with Google Secret Manager token persistence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.1.0",
    "yahoo-fantasy-api>=2.0.0",
    "yahoo-oauth>=0.6.0",
    "google-cloud-secret-manager>=2.16.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahoo", "src/mcp_server.py"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
