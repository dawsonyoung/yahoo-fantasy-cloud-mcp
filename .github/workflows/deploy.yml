name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI

env:
  SERVICE_NAME: "yahoo-fantasy-mcp"
  REGION: "us-east1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Required permissions for Google Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # You will need to create these Repository Secrets in GitHub:
          # Settings -> Secrets and variables -> Actions -> New repository secret
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: .
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=1
            --set-env-vars=YAHOO_SECRET_NAME=YAHOO_OAUTH_TOKEN

      - name: Show Output
        run: echo "Successfully deployed to ${{ steps.deploy.outputs.url }}"
